name: Export Studio verification

on:
  push:
    branches:
      - main
      - chatgpt/verify-export-studio-ci-20261014
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q bandofy_export_studio export_studio.py test_basic.py
      - name: Run synthetic export/import tests
        run: python test_basic.py
      - name: Verify CLI entrypoint
        run: python -m bandofy_export_studio --help
